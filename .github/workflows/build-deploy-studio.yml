name: Build Nova RGB Installer

on:
  push:
    branches: ["main"]
    paths:
      - "src/MKMiniProStudio/**"
      - "assets/**"
      - "installer/**"
      - "scripts/generate-rgb-studio-icon.ps1"
      - ".github/workflows/build-deploy-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare final Nova RGB icon
        shell: powershell
        run: .\scripts\generate-rgb-studio-icon.ps1

      - name: Rebrand UI as Nova RGB
        shell: powershell
        run: |
          $path = '.\src\MKMiniProStudio\MainForm.cs'
          $text = Get-Content $path -Raw
          $text = $text.Replace('MKMINIPRO Studio', 'Nova RGB')
          $text = $text.Replace('RGB Studio', 'Nova RGB')
          Set-Content $path $text -Encoding UTF8

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows app
        shell: powershell
        run: >-
          dotnet publish .\src\MKMiniProStudio\MKMiniProStudio.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\publish

      - name: Verify app
        shell: powershell
        run: |
          Get-ChildItem .\publish -File | Format-Table Name,Length
          if (-not (Test-Path '.\publish\Nova RGB.exe')) { throw 'Nova RGB.exe missing' }

      - name: Install Inno Setup compiler
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Setup EXE
        shell: powershell
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after Inno Setup installation' }
          New-Item -ItemType Directory -Path .\dist -Force | Out-Null
          & $iscc .\installer\RGBStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (-not (Test-Path '.\dist\Nova RGB Setup.exe')) { throw 'Nova RGB Setup.exe missing' }
          Get-Item '.\dist\Nova RGB Setup.exe' | Format-List Name,Length,LastWriteTime

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nova-rgb-setup
          path: dist/Nova RGB Setup.exe
          retention-days: 7

  deliver:
    needs: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: nova-rgb-setup
          path: installer-output

      - name: Put Setup on Desktop
        shell: powershell
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          if ([string]::IsNullOrWhiteSpace($desktop)) { $desktop = Join-Path $env:USERPROFILE 'Desktop' }
          New-Item -ItemType Directory -Path $desktop -Force | Out-Null
          Remove-Item (Join-Path $desktop 'RGB Studio Setup.exe') -Force -ErrorAction SilentlyContinue
          $src = Resolve-Path '.\installer-output\Nova RGB Setup.exe'
          $dst = Join-Path $desktop 'Nova RGB Setup.exe'
          Copy-Item $src $dst -Force
          Write-Host "SETUP_READY=$dst"
