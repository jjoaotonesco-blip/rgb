name: Test MKMINIPRO C Green

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/test-mkminipro-c-green.ps1"
      - ".github/workflows/test-mkminipro-c-green.yml"

permissions:
  contents: read

jobs:
  c-green:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run single-key C green test
        shell: powershell
        run: .\scripts\test-mkminipro-c-green.ps1
