name: Inspect MKMINIPRO Background Software

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Inspect local MKMINIPRO state
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $out = Join-Path $env:RUNNER_TEMP 'mkminipro-local-state'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $report = Join-Path $out 'report.txt'

          function Log($s) { $s | Tee-Object -FilePath $report -Append | Write-Host }
          Log '=== PROCESSES ==='
          Get-CimInstance Win32_Process |
            Where-Object { ($_.Name + ' ' + $_.ExecutablePath + ' ' + $_.CommandLine) -match '(?i)mkminipro|mars.?gaming' } |
            Select-Object ProcessId,Name,ExecutablePath,CommandLine |
            Format-List | Out-String -Width 400 | Tee-Object -FilePath $report -Append | Write-Host

          Log '=== UNINSTALL ENTRIES ==='
          $uninstall = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          Get-ItemProperty $uninstall |
            Where-Object { ($_.DisplayName + ' ' + $_.InstallLocation + ' ' + $_.DisplayIcon) -match '(?i)mkminipro|mars.?gaming' } |
            Select-Object DisplayName,DisplayVersion,InstallLocation,DisplayIcon,UninstallString |
            Format-List | Out-String -Width 400 | Tee-Object -FilePath $report -Append | Write-Host

          Log '=== MATCHING FILES / DIRECTORIES ==='
          $roots = @($env:APPDATA,$env:LOCALAPPDATA,$env:PROGRAMDATA,(Join-Path $env:USERPROFILE 'Documents')) | Where-Object { $_ -and (Test-Path $_) }
          $matches = @()
          foreach ($root in $roots) {
            $matches += Get-ChildItem $root -Force -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '(?i)mkminipro|mars.?gaming' }
          }
          $matches = $matches | Sort-Object FullName -Unique
          $matches | Select-Object FullName,Length,LastWriteTime,PSIsContainer |
            Format-Table -AutoSize | Out-String -Width 500 | Tee-Object -FilePath $report -Append | Write-Host

          Log '=== SQLITE CANDIDATES IN MATCHING DIRECTORIES ==='
          $dirs = $matches | Where-Object PSIsContainer | Select-Object -ExpandProperty FullName -Unique
          foreach ($dir in $dirs) {
            Get-ChildItem $dir -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              $f = $_
              try {
                $fs = [IO.File]::OpenRead($f.FullName)
                $buf = New-Object byte[] 16
                $n = $fs.Read($buf,0,16); $fs.Close()
                $sig = [Text.Encoding]::ASCII.GetString($buf,0,$n)
                if ($sig.StartsWith('SQLite format 3')) {
                  Log ('SQLITE: ' + $f.FullName + ' SIZE=' + $f.Length)
                  Copy-Item $f.FullName (Join-Path $out ('sqlite_' + $f.Name)) -Force
                }
              } catch {}
            }
          }

          Log '=== SMALL TEXT CONFIGS ==='
          foreach ($dir in $dirs) {
            Get-ChildItem $dir -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -lt 2MB -and $_.Extension -match '^\.(ini|xml|json|cfg|txt|dat)$' } |
              ForEach-Object {
                Log ('--- ' + $_.FullName + ' ---')
                try { Get-Content $_.FullName -Raw -ErrorAction Stop | Tee-Object -FilePath $report -Append | Write-Host } catch {}
              }
          }

      - name: Upload local state report
        uses: actions/upload-artifact@v4
        with:
          name: mkminipro-local-state
          path: ${{ runner.temp }}\mkminipro-local-state
          retention-days: 1
