name: Fix Codex Desktop Magic MCP

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-codex-desktop-magic.yml"
  workflow_dispatch:

jobs:
  remove-magic:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Remove broken magic MCP config
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'codex-magic-fix'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $report = Join-Path $out 'magic-fix-report.txt'
          Set-Content -LiteralPath $report -Value "Codex magic MCP fix - $(Get-Date -Format o)"

          function Add-Report([string]$text) {
            Add-Content -LiteralPath $report -Value $text
          }

          function Redact([string]$text) {
            if ($null -eq $text) { return '' }
            $r = $text
            $r = $r -replace '(?i)(api[_-]?key|x-api-key|bearer|authorization|token|secret|password)(["''\s:=]+)[^\s"'']+', '$1$2[REDACTED]'
            $r = $r -replace 'sk-[A-Za-z0-9_-]{20,}', 'sk-[REDACTED]'
            return $r
          }

          $configs = @(
            (Join-Path $env:USERPROFILE '.codex\config.toml'),
            'C:\Users\jjoao\.codex\config.toml'
          ) | Select-Object -Unique

          foreach ($config in $configs) {
            Add-Report ""
            Add-Report "=== $config ==="
            if (-not (Test-Path -LiteralPath $config)) {
              Add-Report 'missing'
              continue
            }

            $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
            $backup = "$config.bak-before-removing-magic-$stamp"
            Copy-Item -LiteralPath $config -Destination $backup -Force
            Copy-Item -LiteralPath $config -Destination (Join-Path $out ("config-$stamp-before.toml")) -Force
            Add-Report "backup: $backup"

            $lines = Get-Content -LiteralPath $config
            $new = New-Object System.Collections.Generic.List[string]
            $removed = New-Object System.Collections.Generic.List[string]
            $skip = $false
            $magicHeader = '^\s*\[\s*mcp_servers\.(?:magic|"magic"|''magic'')(?:\.env)?\s*\]\s*$'
            $anyHeader = '^\s*\[.*\]\s*$'

            foreach ($line in $lines) {
              if ($line -match $magicHeader) {
                $skip = $true
                $removed.Add($line)
                continue
              }
              if ($skip -and $line -match $anyHeader) {
                $skip = $false
              }
              if ($skip) {
                $removed.Add($line)
                continue
              }
              $new.Add($line)
            }

            if ($removed.Count -gt 0) {
              Set-Content -LiteralPath $config -Value $new -Encoding UTF8
              Copy-Item -LiteralPath $config -Destination (Join-Path $out ("config-$stamp-after.toml")) -Force
              Add-Report "removed-lines: $($removed.Count)"
              Add-Report 'removed-section-preview-redacted:'
              Add-Report (Redact (($removed | Select-Object -First 20) -join "`r`n"))
            } else {
              Add-Report 'removed-lines: 0'
              Add-Report 'magic section not found'
            }

            $afterText = Get-Content -LiteralPath $config -Raw
            Add-Report ("contains-magic-after: " + ($afterText -match 'mcp_servers\.(?:magic|"magic"|''magic'')'))
          }

          Add-Report ""
          Add-Report 'Processes after config edit:'
          $procs = Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match 'codex|chatgpt|openai|electron|node' -or $_.CommandLine -match 'codex|chatgpt|openai|magic' } |
            Select-Object ProcessId,Name,ExecutablePath,CommandLine
          Add-Report (Redact ($procs | Format-List | Out-String))

          Compress-Archive -Path (Join-Path $out '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'codex-magic-fix.zip') -Force
          Get-Content -LiteralPath $report

      - name: Upload magic fix report
        uses: actions/upload-artifact@v4
        with:
          name: codex-magic-fix
          path: ${{ runner.temp }}\codex-magic-fix.zip
          if-no-files-found: error
