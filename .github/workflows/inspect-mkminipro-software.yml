name: Inspect MKMINIPRO Software

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/inspect-mkminipro-official.ps1"
      - ".github/workflows/inspect-mkminipro-software.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and inspect official software (no execution)
        shell: powershell
        run: .\scripts\inspect-mkminipro-official.ps1

      - name: Upload static inspection
        uses: actions/upload-artifact@v4
        with:
          name: mkminipro-static-inspection
          path: inspection-output/**
          if-no-files-found: error
          retention-days: 2
