name: Fix MKMINIPRO Studio Source

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-studio-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch source and commit
        shell: pwsh
        run: |
          $p = 'src/MKMiniProStudio/MainForm.cs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('< 60 => (c, x, 0), < 120 => (x, c, 0), < 180 => (0, c, x),', '< 60 => (c, x, 0d), < 120 => (x, c, 0d), < 180 => (0d, c, x),')
          $s = $s.Replace('< 240 => (0, x, c), < 300 => (x, 0, c), _ => (c, 0, x)', '< 240 => (0d, x, c), < 300 => (x, 0d, c), _ => (c, 0d, x)')
          $s = $s.Replace('BeginInvoke(() => SetHardwareStatus(text, color));', 'BeginInvoke(new Action(() => SetHardwareStatus(text, color)));')
          Set-Content $p $s -Encoding utf8NoBOM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $p
          if (git diff --cached --quiet) { Write-Host 'Nothing to patch'; exit 0 }
          git commit -m 'Fix Studio HSV tuple typing and UI invoke'
          git push
