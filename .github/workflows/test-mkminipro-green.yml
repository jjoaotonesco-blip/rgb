name: Test MKMINIPRO Green

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-mkminipro-green.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Enumerate MKMINIPRO and set all LEDs green
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Avoid the vendor app holding the vendor HID interface open.
          Get-Process MKMINIPRO -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $src = @'
using System;
using System.Collections.Generic;
using System.ComponentModel;
using System.Runtime.InteropServices;
using Microsoft.Win32.SafeHandles;

public static class MkMiniRgb {
    const uint DIGCF_PRESENT = 0x00000002;
    const uint DIGCF_DEVICEINTERFACE = 0x00000010;
    const uint GENERIC_READ = 0x80000000;
    const uint GENERIC_WRITE = 0x40000000;
    const uint FILE_SHARE_READ = 0x00000001;
    const uint FILE_SHARE_WRITE = 0x00000002;
    const uint OPEN_EXISTING = 3;

    [StructLayout(LayoutKind.Sequential)]
    struct SP_DEVICE_INTERFACE_DATA {
        public int cbSize;
        public Guid InterfaceClassGuid;
        public int Flags;
        public IntPtr Reserved;
    }

    [StructLayout(LayoutKind.Sequential)]
    struct HIDP_CAPS {
        public short Usage;
        public short UsagePage;
        public short InputReportByteLength;
        public short OutputReportByteLength;
        public short FeatureReportByteLength;
        [MarshalAs(UnmanagedType.ByValArray, SizeConst=17)] public short[] Reserved;
        public short NumberLinkCollectionNodes;
        public short NumberInputButtonCaps;
        public short NumberInputValueCaps;
        public short NumberInputDataIndices;
        public short NumberOutputButtonCaps;
        public short NumberOutputValueCaps;
        public short NumberOutputDataIndices;
        public short NumberFeatureButtonCaps;
        public short NumberFeatureValueCaps;
        public short NumberFeatureDataIndices;
    }

    [DllImport("hid.dll")]
    static extern void HidD_GetHidGuid(out Guid HidGuid);

    [DllImport("setupapi.dll", SetLastError=true, CharSet=CharSet.Auto)]
    static extern IntPtr SetupDiGetClassDevs(ref Guid ClassGuid, IntPtr Enumerator, IntPtr hwndParent, uint Flags);

    [DllImport("setupapi.dll", SetLastError=true)]
    static extern bool SetupDiEnumDeviceInterfaces(IntPtr DeviceInfoSet, IntPtr DeviceInfoData, ref Guid InterfaceClassGuid, uint MemberIndex, ref SP_DEVICE_INTERFACE_DATA DeviceInterfaceData);

    [DllImport("setupapi.dll", SetLastError=true, CharSet=CharSet.Auto)]
    static extern bool SetupDiGetDeviceInterfaceDetail(IntPtr DeviceInfoSet, ref SP_DEVICE_INTERFACE_DATA DeviceInterfaceData, IntPtr DeviceInterfaceDetailData, uint DeviceInterfaceDetailDataSize, out uint RequiredSize, IntPtr DeviceInfoData);

    [DllImport("setupapi.dll")]
    static extern bool SetupDiDestroyDeviceInfoList(IntPtr DeviceInfoSet);

    [DllImport("kernel32.dll", CharSet=CharSet.Auto, SetLastError=true)]
    static extern SafeFileHandle CreateFile(string lpFileName, uint dwDesiredAccess, uint dwShareMode, IntPtr lpSecurityAttributes, uint dwCreationDisposition, uint dwFlagsAndAttributes, IntPtr hTemplateFile);

    [DllImport("kernel32.dll", SetLastError=true)]
    static extern bool WriteFile(SafeFileHandle hFile, byte[] lpBuffer, uint nNumberOfBytesToWrite, out uint lpNumberOfBytesWritten, IntPtr lpOverlapped);

    [DllImport("hid.dll", SetLastError=true)]
    static extern bool HidD_GetPreparsedData(SafeFileHandle HidDeviceObject, out IntPtr PreparsedData);

    [DllImport("hid.dll", SetLastError=true)]
    static extern bool HidD_FreePreparsedData(IntPtr PreparsedData);

    [DllImport("hid.dll")]
    static extern int HidP_GetCaps(IntPtr PreparsedData, out HIDP_CAPS Capabilities);

    static List<string> EnumerateHidPaths() {
        var result = new List<string>();
        HidD_GetHidGuid(out Guid hidGuid);
        IntPtr info = SetupDiGetClassDevs(ref hidGuid, IntPtr.Zero, IntPtr.Zero, DIGCF_PRESENT | DIGCF_DEVICEINTERFACE);
        if (info == new IntPtr(-1)) throw new Win32Exception(Marshal.GetLastWin32Error());
        try {
            uint index = 0;
            while (true) {
                var ifData = new SP_DEVICE_INTERFACE_DATA { cbSize = Marshal.SizeOf(typeof(SP_DEVICE_INTERFACE_DATA)) };
                if (!SetupDiEnumDeviceInterfaces(info, IntPtr.Zero, ref hidGuid, index, ref ifData)) {
                    int err = Marshal.GetLastWin32Error();
                    if (err == 259) break; // ERROR_NO_MORE_ITEMS
                    throw new Win32Exception(err);
                }
                SetupDiGetDeviceInterfaceDetail(info, ref ifData, IntPtr.Zero, 0, out uint needed, IntPtr.Zero);
                IntPtr detail = Marshal.AllocHGlobal((int)needed);
                try {
                    // cbSize is 8 on x64, 6 on x86 for SP_DEVICE_INTERFACE_DETAIL_DATA.
                    Marshal.WriteInt32(detail, IntPtr.Size == 8 ? 8 : 6);
                    if (!SetupDiGetDeviceInterfaceDetail(info, ref ifData, detail, needed, out needed, IntPtr.Zero))
                        throw new Win32Exception(Marshal.GetLastWin32Error());
                    IntPtr pDevicePath = IntPtr.Add(detail, 4);
                    string path = Marshal.PtrToStringAuto(pDevicePath);
                    if (!String.IsNullOrEmpty(path)) result.Add(path);
                } finally { Marshal.FreeHGlobal(detail); }
                index++;
            }
        } finally { SetupDiDestroyDeviceInfoList(info); }
        return result;
    }

    static byte[] MakeSimple(byte cmd) {
        var r = new byte[65];
        r[0] = 0x00;
        r[1] = 0x55;
        r[2] = cmd;
        r[3] = 0x00;
        r[4] = Checksum(r);
        return r;
    }

    static byte[] MakeData(byte[] rgb, int offset, int len) {
        var r = new byte[65];
        r[0] = 0x00;
        r[1] = 0x55;
        r[2] = 0xDD;
        r[3] = 0x00;
        r[4] = 0x00;
        r[5] = (byte)len;
        r[6] = (byte)(offset & 0xFF);
        r[7] = (byte)((offset >> 8) & 0xFF);
        r[8] = 0x00;
        Array.Copy(rgb, offset, r, 9, len);
        r[4] = Checksum(r);
        return r;
    }

    static byte Checksum(byte[] r) {
        int sum = 0;
        for (int i = 5; i < 65; i++) sum += r[i];
        return (byte)(sum & 0xFF);
    }

    static void Send(SafeFileHandle h, byte[] report, string label) {
        if (!WriteFile(h, report, (uint)report.Length, out uint written, IntPtr.Zero))
            throw new Win32Exception(Marshal.GetLastWin32Error(), "WriteFile failed for " + label);
        if (written != 65) throw new Exception(label + ": wrote " + written + " bytes, expected 65");
        Console.WriteLine(label + " OK checksum=0x" + report[4].ToString("X2"));
        System.Threading.Thread.Sleep(8);
    }

    public static void Run() {
        string target = null;
        foreach (string p in EnumerateHidPaths()) {
            string q = p.ToLowerInvariant();
            if (q.Contains("vid_5566") && q.Contains("pid_0008")) {
                Console.WriteLine("Found MKMINIPRO HID: " + p);
                if (q.Contains("mi_02")) target = p;
            }
        }
        if (target == null) throw new Exception("VID_5566/PID_0008 MI_02 was not found.");
        Console.WriteLine("Using vendor HID interface: " + target);

        using (var h = CreateFile(target, GENERIC_READ | GENERIC_WRITE, FILE_SHARE_READ | FILE_SHARE_WRITE, IntPtr.Zero, OPEN_EXISTING, 0, IntPtr.Zero)) {
            if (h.IsInvalid) throw new Win32Exception(Marshal.GetLastWin32Error(), "Could not open MI_02");

            if (!HidD_GetPreparsedData(h, out IntPtr prep)) throw new Win32Exception(Marshal.GetLastWin32Error(), "HidD_GetPreparsedData failed");
            try {
                int status = HidP_GetCaps(prep, out HIDP_CAPS caps);
                if (status < 0) throw new Exception("HidP_GetCaps failed status=" + status);
                Console.WriteLine("InputReportByteLength=" + caps.InputReportByteLength);
                Console.WriteLine("OutputReportByteLength=" + caps.OutputReportByteLength);
                Console.WriteLine("FeatureReportByteLength=" + caps.FeatureReportByteLength);
                Console.WriteLine("UsagePage=0x" + ((ushort)caps.UsagePage).ToString("X4") + " Usage=0x" + ((ushort)caps.Usage).ToString("X4"));
                if (caps.OutputReportByteLength != 65)
                    throw new Exception("Safety stop: OutputReportByteLength is not 65.");
            } finally { HidD_FreePreparsedData(prep); }

            // 128 logical RGB slots x 3 bytes. All slots = pure green.
            var rgb = new byte[384];
            for (int i = 0; i < 128; i++) {
                rgb[i*3 + 0] = 0;
                rgb[i*3 + 1] = 255;
                rgb[i*3 + 2] = 0;
            }

            Send(h, MakeSimple(0x01), "BEGIN 55 01");
            for (int chunk = 0; chunk < 7; chunk++) {
                int offset = chunk * 56;
                int len = chunk < 6 ? 56 : 48;
                Send(h, MakeData(rgb, offset, len), "DATA " + chunk + " offset=" + offset + " len=" + len);
            }
            Send(h, MakeSimple(0x02), "APPLY 55 02");
            Console.WriteLine("RGB sequence completed. Keyboard should now be green if protocol/order is correct.");
        }
    }
}
'@

          Add-Type -TypeDefinition $src -Language CSharp
          [MkMiniRgb]::Run()
