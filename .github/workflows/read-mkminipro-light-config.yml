name: Read MKMINIPRO Lighting Config

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/read-mkminipro-light-config.ps1"
      - ".github/workflows/read-mkminipro-light-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read lighting config only
        shell: powershell
        run: .\scripts\read-mkminipro-light-config.ps1
