name: Capture official MKMINIPRO Custom HID writes

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/capture-official-custom.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: Short HID capture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $tool = 'C:\Users\jjoao\Documents\Playground\tamanho\tools\mkminipro_writefile_stack.py'
          if (-not (Test-Path $tool)) { throw "Logger not found: $tool" }
          $dir = Join-Path $env:RUNNER_TEMP 'mkminipro-short-capture'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $out = Join-Path $dir 'mkminipro-official-custom.log'
          $report = Join-Path $dir 'report.txt'
          "SHORT_CAPTURE_READY $(Get-Date -Format o)" | Set-Content $report
          "No MKMINIPRO oficial: Custom -> cor simples -> Apply/Save uma vez." | Add-Content $report
          python $tool --wait 20 --seconds 12 --output $out | Tee-Object -FilePath (Join-Path $dir 'stdout.txt')
          "--- capture log ---" | Add-Content $report
          if (Test-Path $out) { Get-Content $out | Add-Content $report } else { "NO_CAPTURE_LOG_FILE" | Add-Content $report }
          Get-Content $report
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: mkminipro-official-custom-short-capture
          path: ${{ runner.temp }}\mkminipro-short-capture
          retention-days: 1
